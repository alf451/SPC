# Configurazione Edge Agent — una copia per PC di stazione.
# Copiare in config.yaml e adattare. Gli ID reali (daq_source_id, feature_id)
# sono risolti dal backend al messaggio "hello" — qui si definiscono solo le
# sorgenti fisiche locali (porte COM / dispositivi HID) di questa stazione.

# Indicare la stazione in UNO dei due modi seguenti (non entrambi):
#
# 1) per nome (consigliato) — l'agent la risolve da solo al primo avvio
#    tramite POST /api/stations/resolve (crea sede/stazione se non esistono
#    ancora, altrimenti riusa quelle già presenti): niente ID numerico da
#    cercare/copiare a mano, causa reale di configurazioni sbagliate durante
#    il collaudo (vedi docs/problemi-riscontrati.md).
station:
  site_name: "Mopla"
  name: "SCQ3"
  # computer_name: se omesso, viene rilevato automaticamente (nome di questo PC)

# 2) per id numerico già noto (es. configurazioni esistenti, o se si preferisce
#    controllo esplicito) — se presente ha la precedenza sul blocco "station" sopra.
# station_id: 1

backend:
  ws_url: "ws://localhost:8000/ws/agent"
  # token JWT di un account di servizio, ottenuto con POST /api/auth/login
  token: "CHANGE_ME"
  reconnect_backoff_seconds: [1, 2, 5, 10, 30]  # riprovato ciclicamente, l'ultimo valore si ripete
  heartbeat_interval_seconds: 20

outbox:
  sqlite_path: "./outbox.sqlite3"
  retry_interval_seconds: 5

sources:
  # calibro/micrometro RS232 in modalità "push" (invio alla pressione del tasto DATA)
  - type: rs232
    port: "COM3"
    channel_no: null
    baud_rate: 9600
    data_bits: 7
    parity: "E"        # N | E | O
    stop_bits: 1
    mode: "push"        # "push" (ascolto continuo) | "polled" (invia request_command e attende)
    request_command: null      # es. "R\r\n" se mode=polled
    frame_terminator: "\r\n"

  # Ricevitore Mitutoyo U-Wave-R con più trasmettitori U-Wave-T abbinati (uno
  # per calibro/micrometro), TUTTI sulla stessa porta COM virtuale (creata da
  # U-WAVEPAK) - il canale che distingue ogni strumento è dentro al testo di
  # ogni frame ("DT10000+...", "DT10001+...", ...), non nella porta: per
  # questo qui c'è "channels" (elenco) invece di "channel_no" (singolo), e
  # frame_format "uwave" invece di quello generico. Formato e parametri
  # confermati via cattura diretta sull'hardware reale (vedi
  # docs/problemi-riscontrati.md e digimatic_rs232.py::parse_uwave_frame).
  - type: rs232
    port: "COM7"
    channels: [10000, 10001, 10002]   # un channel_no per trasmettitore abbinato, assegnato via U-WAVEPAK
    frame_format: "uwave"
    baud_rate: 57600
    data_bits: 8
    parity: "N"
    stop_bits: 1
    mode: "push"
    frame_terminator: "\r"   # CR da solo, non CRLF - confermato via cattura reale

  # Box multiplex "vero" (canali su porte/percorsi VIRTUALI SEPARATI, non
  # multiplexati nel testo del frame) - qui basta un blocco normale per
  # canale, con "port" diverso per ciascuno (non lo stesso "port" ripetuto:
  # aprire due volte la stessa porta fallisce, un solo processo puo' tenerla aperta).
  - type: rs232
    port: "COM4"
    channel_no: 1
    baud_rate: 4800
    data_bits: 8
    parity: "N"
    stop_bits: 1
    mode: "polled"
    request_command: "C1\r\n"
    frame_terminator: "\r\n"

  # convertitore USB-ITN (emulazione tastiera) — es. Mitutoyo IT-016U
  - type: usb_hid
    device_path: null   # opzionale: path hidapi specifico se ci sono più convertitori sullo stesso PC
    poll_interval_ms: 50
